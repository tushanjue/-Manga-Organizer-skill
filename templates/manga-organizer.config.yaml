version: 1

source: ""
output: ""

profile: kavita-chapter
mode: auto-safe

language: zh-Hans
reading_direction: rtl
metadata: bangumi

safety:
  preserve_source: true
  overwrite_source: false
  backup_existing_output: true
  staging_directory: ""
  stop_on_blocker: true
  metadata_only_update:
    preserve_non_metadata_member_bytes: true
    preserve_member_order: true
    preserve_page_order: true
    preserve_chapter_identity: true
    require_backup: true
    require_staging_and_atomic_replace: true

network:
  use_session_proxy: true
  http_proxy: "http://127.0.0.1:17891"
  https_proxy: "http://127.0.0.1:17891"
  all_proxy: "socks5://127.0.0.1:17891"
  timeout_seconds: 30
  retries: 3

bangumi:
  enabled: true
  metadata_language: zh-Hans
  require_chinese_title_fields: true
  allow_japanese_title_fallback: false
  allow_japanese_creator_names: true
  allow_title_translation: false
  original_title_policy: report-only
  missing_non_summary_chinese_action: needs-review
  user_agent: "developer-id/Manga-Organizer-Skill/1.0"
  access_token_from_environment: BANGUMI_ACCESS_TOKEN
  auto_match_threshold: 0.92
  winner_margin: 0.10
  cache_days: 30
  cover_policy: library-only

metadata_policy:
  chinese_fields: [Series, LocalizedSeries, SeriesSort, Title, Summary, Genre]
  normal_chapter_title: "第{chapter}话"
  summary_translation:
    japanese_when_chinese_missing: true
    style: natural-editorial-chinese
    preserve_facts_and_spoiler_level: true
    forbid_unsupported_additions: true
    forbid_ai_style_cliches: true
    forbid_japanese_kana_in_output: true
    require_fidelity_and_naturalness_review: true
    record_source_provenance: true
    unresolved_action: needs-review
  publisher:
    format: "{zh}（{original}）"
    use_fullwidth_parentheses: true
    avoid_identical_duplication: true
    incomplete_action: needs-review
  tags:
    forbid_han_by_default: true
    allowed_han_release_tags: [简中, 繁中, 汉化, 扫图]
    protected: [cosplay]
    preserve_existing_exact: [cosplay]
    locked_special_allowlist: []
    route_release_terms_outside_tags: false
    unresolved_action: needs-review

naming:
  series_directory: "{series}"
  volume_file: "{series} v{volume:02}.cbz"
  chapter_file: "{series} Vol.{volume:02} Ch.{chapter:03}.cbz"
  chapter_file_without_volume: "{series} Ch.{chapter:03}.cbz"
  special_directory: "Specials"
  special_file: "{series} SP{chapter:02} {title}.cbz"
  page_file: "{page:0000}.{extension}"
  sanitize_for_windows: true

images:
  preserve_original_bytes: true
  fix_exif_orientation: true
  detect_duplicates: true
  detect_spreads: true
  split_spreads: false
  split_direction: rtl

pdf:
  profile: balanced-high-quality
  prefer_lossless_extraction: true
  render_dpi: 240
  jpeg_quality: 92
  avoid_upscaling: true
  preserve_original_pdf: true
  split_multi_chapter_volumes: true
  allow_ocr_for_boundaries: false
  unresolved_boundary_action: fallback-volume
  fallback_requires_confirmed_volume_identity: true
  fallback_requires_exact_source_page_coverage: true
  fallback_preserve_natural_page_order: true

chapter_packaging:
  one_chapter_per_cbz_when_boundaries_reliable: true
  global_volume_profile_requires_explicit_request: true
  automatic_volume_fallback: true
  fallback_omit_chapter_number: true
  require_continuous_chapters: true
  require_contiguous_page_spans: true
  require_exact_source_page_coverage: true
  front_matter: first_chapter
  end_matter: last_chapter
  preserve_repeated_release_pages: true
  alternate_editions_directory: "_Needs Review/Alternate Editions"

epub:
  convert_image_based: true
  preserve_reflowable: true

comicinfo:
  preserve_unknown_fields: true
  language: zh-Hans
  manga: YesAndRightToLeft
  include_page_entries: true
  mark_first_page_as_cover: true

validation:
  verify_crc: true
  decode_all_images: true
  verify_page_count: true
  verify_xml: true
  verify_kavita_layout: true
  create_sha256: true
  verify_unique_chapter_identity: true
  verify_one_package_unit_per_cbz: true
  allow_documented_volume_fallback: true
  verify_volume_fallback_identity: true
  verify_source_page_coverage: true
  verify_source_hash_unchanged: true
  verify_chinese_title_fields: true
  verify_summary_translation_fidelity: true
  verify_summary_translation_naturalness: true
  verify_no_japanese_kana_in_summary: true
  verify_publisher_policy: true
  verify_tag_language_policy: true
  verify_protected_tags: true
  verify_non_metadata_member_bytes: true
  verify_member_order_unchanged: true
  verify_chapter_identity_unchanged: true
